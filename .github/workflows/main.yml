name: Deploy MLOps Infrastructure

on:
  push:
    branches: [ "master" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Free Disk Space on Runner
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo df -h

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Create Virtual Environment & Install Exact Dependencies
        run: |
          python -m venv venv
          source venv/bin/activate
          python -m pip install --upgrade "pip<24.1" setuptools wheel
          pip install --no-cache-dir --force-reinstall -r requirements.txt
          python -c "import sagemaker; print('SageMaker Version:', sagemaker.__version__); from sagemaker.workflow.pipeline import Pipeline; print('Pipeline module OK!')"
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-3

      - name: Update SageMaker Pipeline
        run: |
          source venv/bin/activate
          python pipeline.py \
            --role-arn "${{ secrets.AWS_SAGEMAKER_ROLE_ARN }}" \
            --bucket-name "${{ secrets.AWS_S3_BUCKET }}" \
            --region "eu-west-3"

      - name: Deploy Step Functions State Machine
        run: |
          aws stepfunctions update-state-machine \
            --state-machine-arn "${{ secrets.AWS_STEP_FUNCTIONS_ARN }}" \
            --definition file://statemachine/workflow.json