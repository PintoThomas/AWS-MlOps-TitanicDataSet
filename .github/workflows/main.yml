name: Deploy MLOps Infrastructure

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-3

      - name: Update SageMaker Pipeline
        run: |
          python pipeline.py \
            --role-arn "${{ secrets.AWS_SAGEMAKER_ROLE_ARN }}" \
            --bucket-name "${{ secrets.AWS_S3_BUCKET }}" \
            --region "eu-west-3"

      - name: Deploy Step Functions State Machine
        run: |
          aws stepfunctions update-state-machine \
            --state-machine-arn "${{ secrets.AWS_STEP_FUNCTIONS_ARN }}" \
            --definition file://statemachine/workflow.json
